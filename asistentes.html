<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistencia · Sistema de Capacitaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --azul-marca: #1F61A8; --azul-glow: #4FA6FF; --cian: #00E5FF;
    --fondo-0: #030711; --panel: rgba(12, 22, 41, 0.72); --panel-borde: rgba(79, 166, 255, 0.22);
    --texto: #EAF2FF; --texto-suave: #7E93B8; --verde: #34D399; --rojo: #FF5D7A; --amarillo: #FBBF24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body { font-family: 'Inter', -apple-system, sans-serif; color: var(--texto); background: var(--fondo-0); min-height: 100vh; position: relative; }
  .malla {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(79,166,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(79,166,255,0.06) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 80%);
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 80%);
    pointer-events: none;
  }
  .halo { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; opacity: 0.4; }
  .halo-1 { width: 520px; height: 520px; top: -200px; left: -160px; background: radial-gradient(circle, rgba(31,97,168,0.55), transparent 70%); }
  .halo-2 { width: 560px; height: 560px; bottom: -220px; right: -180px; background: radial-gradient(circle, rgba(0,229,255,0.15), transparent 70%); }

  header {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; background: var(--panel); border-bottom: 1px solid var(--panel-borde); backdrop-filter: blur(18px);
  }
  .marca { display: flex; align-items: center; gap: 12px; }
  .volver {
    display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--texto-suave);
    font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 8px; transition: color .15s ease, background .15s ease;
  }
  .volver:hover { color: #fff; background: rgba(79,166,255,0.08); }
  .marca-texto { display: flex; flex-direction: column; }
  .marca-texto .nombre { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; color: #fff; }
  .marca-texto .sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--texto-suave); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--azul-glow), var(--cian));
    display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #071022; font-size: 13px;
  }

  .contenedor { position: relative; max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }

  .tarjeta-cap {
    padding: 20px 22px; border-radius: 12px; background: var(--panel); border: 1px solid var(--panel-borde);
    backdrop-filter: blur(18px); margin-bottom: 24px;
  }
  .tarjeta-cap .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--cian); margin: 0 0 6px; }
  .tarjeta-cap h1 { font-family: 'Space Grotesk', sans-serif; font-size: 21px; margin: 0 0 10px; color: #fff; }
  .meta-cap { display: flex; flex-wrap: wrap; gap: 18px; font-size: 12.5px; color: var(--texto-suave); }
  .meta-cap span b { color: var(--texto); font-weight: 600; }

  .grid-principal { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid-principal { grid-template-columns: 1fr; } }

  .panel {
    padding: 20px 22px; border-radius: 12px; background: var(--panel); border: 1px solid var(--panel-borde); backdrop-filter: blur(18px);
  }
  .panel h2 { font-family: 'Space Grotesk', sans-serif; font-size: 15.5px; margin: 0 0 16px; color: #fff; }

  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 12px; font-weight: 600; color: var(--texto-suave); margin-bottom: 6px; }
  .fila-doc { display: flex; gap: 8px; }
  input[type="text"] {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1.5px solid rgba(79,166,255,0.18);
    background: rgba(255,255,255,0.03); color: var(--texto); font-family: 'JetBrains Mono', monospace; font-size: 13.5px;
  }
  input[readonly] { opacity: .75; }
  input:focus { outline: none; border-color: var(--azul-glow); }
  input::placeholder { color: rgba(126,147,184,0.55); }

  button.principal {
    padding: 11px 18px; border: none; border-radius: 9px;
    background: linear-gradient(135deg, var(--azul-marca), var(--azul-glow)); color: #fff;
    font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 28px -10px rgba(31,97,168,0.65); white-space: nowrap;
  }
  button.principal:hover { filter: brightness(1.1); }
  button.principal:disabled { opacity: .55; cursor: wait; }
  button.secundario {
    padding: 10px 16px; border-radius: 8px; border: 1.5px solid var(--panel-borde);
    background: rgba(255,255,255,0.03); color: var(--texto); font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  button.secundario:hover { border-color: var(--azul-glow); }
  button.bloque { width: 100%; }

  .estado-linea { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--texto-suave); margin-top: 8px; }
  .estado-linea.ok { color: var(--verde); }
  .estado-linea.pendiente { color: var(--amarillo); }

  canvas#firmaPad {
    width: 100%; height: 150px; border-radius: 8px; border: 1.5px dashed rgba(79,166,255,0.3);
    background: rgba(255,255,255,0.02); touch-action: none; cursor: crosshair;
  }
  .firma-acciones { display: flex; gap: 8px; margin-top: 8px; }

  .mensaje {
    margin-top: 14px; padding: 10px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 500; display: none; font-family: 'JetBrains Mono', monospace;
  }
  .mensaje.error { display: block; background: rgba(255,93,122,0.09); color: var(--rojo); border: 1px solid rgba(255,93,122,0.28); }
  .mensaje.exito { display: block; background: rgba(52,211,153,0.09); color: var(--verde); border: 1px solid rgba(52,211,153,0.28); }

  .panel-tabla { margin-top: 22px; border-radius: 12px; background: var(--panel); border: 1px solid var(--panel-borde); backdrop-filter: blur(18px); overflow: hidden; }
  .panel-tabla .cab { padding: 16px 20px; border-bottom: 1px solid var(--panel-borde); display:flex; align-items:center; justify-content:space-between; }
  .panel-tabla .cab h2 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; margin: 0; color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; padding: 11px 18px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    letter-spacing: .06em; text-transform: uppercase; color: var(--texto-suave); border-bottom: 1px solid var(--panel-borde);
  }
  tbody td { padding: 12px 18px; font-size: 13px; border-bottom: 1px solid rgba(79,166,255,0.08); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(79,166,255,0.04); }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 100px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; }
  .badge.dentro { background: rgba(251,191,36,0.12); color: var(--amarillo); border: 1px solid rgba(251,191,36,0.3); }
  .badge.salio { background: rgba(52,211,153,0.12); color: var(--verde); border: 1px solid rgba(52,211,153,0.3); }
  .btn-icono { background: none; border: none; color: var(--texto-suave); cursor: pointer; font-size: 13px; padding: 4px 7px; border-radius: 6px; }
  .btn-icono:hover { color: var(--azul-glow); background: rgba(79,166,255,0.08); }
  .vacio, .cargando { text-align: center; padding: 30px 20px; color: var(--texto-suave); font-size: 13px; }

  @media (max-width: 560px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { padding: 10px 0; border-bottom: 1px solid var(--panel-borde); }
    tbody td { padding: 3px 18px; }
  }
</style>
</head>
<body>

<div class="malla"></div>
<div class="halo halo-1"></div>
<div class="halo halo-2"></div>

<header>
  <div class="marca">
    <a class="volver" href="capacitaciones.html">← Capacitaciones</a>
    <div class="marca-texto">
      <span class="nombre">Sucden Servicios</span>
      <span class="sub">Registro de Asistencia</span>
    </div>
  </div>
  <div class="avatar" id="avatarUsuario">—</div>
</header>

<div class="contenedor">

  <div class="tarjeta-cap" id="tarjetaCapacitacion">
    <p class="eyebrow">Capacitación</p>
    <h1 id="capTema">Cargando…</h1>
    <div class="meta-cap" id="capMeta"></div>
  </div>

  <div class="grid-principal">

    <!-- ---------- Panel: registrar asistencia ---------- -->
    <div class="panel">
      <h2>Registrar asistencia</h2>
      <form id="formAsistencia">
        <div class="campo">
          <label for="aDocumento">Documento</label>
          <div class="fila-doc">
            <input type="text" id="aDocumento" inputmode="numeric" placeholder="Número de documento" required>
            <button type="button" class="secundario" id="btnBuscar">Buscar</button>
          </div>
        </div>

        <div class="campo">
          <label for="aNombre">Nombre</label>
          <input type="text" id="aNombre" placeholder="Se autocompleta al buscar" readonly>
        </div>

        <div class="campo">
          <label for="aCargo">Cargo / Área / Regional</label>
          <input type="text" id="aCargo" placeholder="Se autocompleta al buscar" readonly>
        </div>

        <div class="campo">
          <label>Ubicación GPS</label>
          <button type="button" class="secundario bloque" id="btnGPS">📍 Capturar ubicación</button>
          <div class="estado-linea pendiente" id="estadoGPS">Sin capturar</div>
        </div>

        <div class="campo">
          <label>Firma</label>
          <canvas id="firmaPad"></canvas>
          <div class="firma-acciones">
            <button type="button" class="secundario" id="btnLimpiarFirma">Limpiar</button>
          </div>
          <div class="estado-linea pendiente" id="estadoFirma">Sin firma</div>
        </div>

        <button type="submit" class="principal bloque" id="btnRegistrar" style="margin-top:6px;">Registrar asistencia</button>
        <div id="mensajeAsistencia" class="mensaje"></div>
      </form>
    </div>

    <!-- ---------- Panel: evidencia fotográfica ---------- -->
    <div class="panel">
      <h2>Evidencia fotográfica</h2>
      <form id="formFoto">
        <div class="campo">
          <label for="fotoInput">Foto</label>
          <input type="file" id="fotoInput" accept="image/*" capture="environment" required>
        </div>
        <div class="campo">
          <label for="fotoDescripcion">Descripción</label>
          <input type="text" id="fotoDescripcion" placeholder="Ej: Registro de asistentes salón 2">
        </div>
        <button type="submit" class="principal bloque" id="btnSubirFoto">Subir evidencia</button>
        <div id="mensajeFoto" class="mensaje"></div>
      </form>

      <h2 style="margin-top:22px;">Fotos subidas</h2>
      <div id="galeriaFotos" class="cargando">Cargando…</div>
    </div>

  </div>

  <!-- ---------- Panel: Reporte WhatsApp ---------- -->
  <div class="panel" style="margin-top:20px;">
    <h2>Reporte por WhatsApp</h2>
    <div class="campo">
      <label for="waTelefono">Teléfono destino (con indicativo, ej: 573001234567)</label>
      <input type="text" id="waTelefono" inputmode="numeric" placeholder="Déjalo vacío para usar el de Configuración">
    </div>
    <button type="button" class="principal bloque" id="btnPrepararWA">Generar y enviar reporte</button>
    <div id="mensajeWA" class="mensaje"></div>
  </div>

  <!-- ---------- Tabla de asistentes ---------- -->
  <div class="panel-tabla">
    <div class="cab"><h2>Asistentes registrados</h2></div>
    <div id="contenedorTabla"><div class="cargando">Cargando asistentes…</div></div>
  </div>

</div>

<script>
  // ============================================================
  // PEGA AQUÍ LA MISMA URL DE TU DESPLIEGUE (idéntica a login.html)
  // ============================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbwdbN8Id17tAXV-sR7H-XW6cfADvLbvXmK22ol7CsvUdeswCaOG5ftvc5RnwEzcDKs/exec";

  // ---------- Sesión ----------
  const token = sessionStorage.getItem('token');
  const usuarioRaw = sessionStorage.getItem('usuario');
  if (!token || !usuarioRaw) { window.location.href = 'login.html'; }
  const usuarioActual = JSON.parse(usuarioRaw || '{}');
  document.getElementById('avatarUsuario').textContent = (usuarioActual['Nombre Completo'] || '?').trim().charAt(0).toUpperCase();

  // ---------- ID de capacitación desde la URL ----------
  const params = new URLSearchParams(window.location.search);
  const idCapacitacion = params.get('cap');

  if (!idCapacitacion) {
    document.getElementById('capTema').textContent = 'No se especificó una capacitación';
    document.getElementById('capMeta').innerHTML = '<span>Vuelve a <a href="capacitaciones.html" style="color:var(--azul-glow)">Capacitaciones</a> y entra desde el ícono 👥</span>';
  }

  // ---------- Llamada genérica a la API ----------
  function llamarAPI(accion, datos) {
    const body = Object.assign({ accion: accion, token: token }, datos || {});
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); })
      .then(function (respuesta) {
        if (!respuesta.success && /no autorizado/i.test(respuesta.message || '')) {
          sessionStorage.removeItem('token');
          sessionStorage.removeItem('usuario');
          window.location.href = 'login.html';
        }
        return respuesta;
      });
  }

  function formatearHora(valor) {
    if (!valor) return '—';
    const f = new Date(valor);
    if (isNaN(f.getTime())) return String(valor);
    return f.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  }
  function formatearFechaCorta(valor) {
    if (!valor) return '—';
    const f = new Date(valor);
    if (isNaN(f.getTime())) return String(valor);
    return f.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  // ---------- Cargar datos de la capacitación ----------
  function cargarCapacitacion() {
    if (!idCapacitacion) return;
    llamarAPI('obtenerCapacitacion', { id: idCapacitacion }).then(function (respuesta) {
      if (!respuesta.success || !respuesta.data) {
        document.getElementById('capTema').textContent = 'Capacitación no encontrada';
        return;
      }
      const c = respuesta.data;
      document.getElementById('capTema').textContent = c['Tema'] || '—';
      document.getElementById('capMeta').innerHTML =
        '<span>👤 Instructor: <b>' + (c['Instructor'] || '—') + '</b></span>' +
        '<span>📅 Fecha: <b>' + formatearFechaCorta(c['Fecha']) + '</b></span>' +
        '<span>📍 Lugar: <b>' + (c['Lugar'] || '—') + '</b></span>' +
        '<span>🏷️ Estado: <b>' + (c['Estado'] || '—') + '</b></span>';
    });
  }

  // ---------- Buscar usuario por documento ----------
  document.getElementById('btnBuscar').addEventListener('click', function () {
    const documento = document.getElementById('aDocumento').value.trim();
    if (!documento) return;
    const btn = this;
    btn.disabled = true;
    btn.textContent = 'Buscando...';

    llamarAPI('buscarUsuario', { documento: documento }).then(function (respuesta) {
      btn.disabled = false;
      btn.textContent = 'Buscar';
      const mensaje = document.getElementById('mensajeAsistencia');

      if (respuesta.success) {
        const u = respuesta.data;
        document.getElementById('aNombre').value = u['Nombre Completo'] || '';
        document.getElementById('aCargo').value = [u['Cargo'], u['Área'], u['Regional']].filter(Boolean).join(' · ');
        mensaje.className = 'mensaje';
        mensaje.textContent = '';
      } else {
        document.getElementById('aNombre').value = '';
        document.getElementById('aCargo').value = '';
        mensaje.className = 'mensaje error';
        mensaje.textContent = respuesta.message || 'Usuario no encontrado. Puede registrarse igual con el nombre manual.';
        document.getElementById('aNombre').removeAttribute('readonly');
      }
    });
  });

  // ---------- GPS ----------
  let ubicacionGPS = '';
  document.getElementById('btnGPS').addEventListener('click', function () {
    const estado = document.getElementById('estadoGPS');
    if (!navigator.geolocation) {
      estado.textContent = 'Este dispositivo no soporta geolocalización';
      return;
    }
    estado.textContent = 'Obteniendo ubicación...';
    navigator.geolocation.getCurrentPosition(function (pos) {
      ubicacionGPS = pos.coords.latitude.toFixed(6) + ',' + pos.coords.longitude.toFixed(6);
      estado.className = 'estado-linea ok';
      estado.textContent = '✅ Ubicación capturada: ' + ubicacionGPS;
    }, function (err) {
      estado.className = 'estado-linea pendiente';
      estado.textContent = 'No se pudo obtener la ubicación (' + err.message + ')';
    }, { enableHighAccuracy: true, timeout: 10000 });
  });

  // ---------- Firma (canvas) ----------
  const canvas = document.getElementById('firmaPad');
  const ctx = canvas.getContext('2d');
  let dibujando = false;
  let tieneTrazo = false;

  function ajustarCanvas() {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.strokeStyle = '#EAF2FF';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
  }
  ajustarCanvas();
  window.addEventListener('resize', function () {
    const datos = canvas.toDataURL();
    ajustarCanvas();
    tieneTrazo = false;
  });

  function coordenadas(evento) {
    const rect = canvas.getBoundingClientRect();
    const punto = evento.touches ? evento.touches[0] : evento;
    return { x: punto.clientX - rect.left, y: punto.clientY - rect.top };
  }

  function iniciarTrazo(e) {
    dibujando = true;
    const p = coordenadas(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    e.preventDefault();
  }
  function moverTrazo(e) {
    if (!dibujando) return;
    const p = coordenadas(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    tieneTrazo = true;
    e.preventDefault();
  }
  function terminarTrazo() { dibujando = false; }

  canvas.addEventListener('mousedown', iniciarTrazo);
  canvas.addEventListener('mousemove', moverTrazo);
  window.addEventListener('mouseup', terminarTrazo);
  canvas.addEventListener('touchstart', iniciarTrazo, { passive: false });
  canvas.addEventListener('touchmove', moverTrazo, { passive: false });
  canvas.addEventListener('touchend', terminarTrazo);

  document.getElementById('btnLimpiarFirma').addEventListener('click', function () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tieneTrazo = false;
    document.getElementById('estadoFirma').className = 'estado-linea pendiente';
    document.getElementById('estadoFirma').textContent = 'Sin firma';
  });

  // ---------- Registrar asistencia ----------
  document.getElementById('formAsistencia').addEventListener('submit', function (e) {
    e.preventDefault();

    const documento = document.getElementById('aDocumento').value.trim();
    const nombre = document.getElementById('aNombre').value.trim();
    const mensaje = document.getElementById('mensajeAsistencia');
    const btn = document.getElementById('btnRegistrar');

    if (!idCapacitacion) {
      mensaje.className = 'mensaje error';
      mensaje.textContent = 'No hay una capacitación seleccionada.';
      return;
    }
    if (!documento || !nombre) {
      mensaje.className = 'mensaje error';
      mensaje.textContent = 'Busca el documento o escribe el nombre antes de registrar.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Registrando...';
    mensaje.className = 'mensaje';
    mensaje.textContent = '';

    function continuarRegistro(firmaUrl) {
      const datosAsistencia = {
        'ID Capacitación': idCapacitacion,
        'Documento': documento,
        'Nombre': nombre,
        'Ubicación GPS': ubicacionGPS,
        'Dispositivo': navigator.userAgent.substring(0, 120)
      };
      if (firmaUrl) datosAsistencia['Firma URL'] = firmaUrl;

      llamarAPI('registrarAsistencia', datosAsistencia).then(function (respuesta) {
        btn.disabled = false;
        btn.textContent = 'Registrar asistencia';

        if (respuesta.success) {
          mensaje.className = 'mensaje exito';
          mensaje.textContent = 'Asistencia registrada correctamente.';
          document.getElementById('formAsistencia').reset();
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          tieneTrazo = false;
          document.getElementById('estadoFirma').className = 'estado-linea pendiente';
          document.getElementById('estadoFirma').textContent = 'Sin firma';
          document.getElementById('estadoGPS').className = 'estado-linea pendiente';
          document.getElementById('estadoGPS').textContent = 'Sin capturar';
          ubicacionGPS = '';
          cargarAsistentes();
        } else {
          mensaje.className = 'mensaje error';
          mensaje.textContent = respuesta.message || 'No se pudo registrar la asistencia.';
        }
      }).catch(function (error) {
        btn.disabled = false;
        btn.textContent = 'Registrar asistencia';
        mensaje.className = 'mensaje error';
        mensaje.textContent = 'Error de conexión: ' + error.message;
      });
    }

    if (tieneTrazo) {
      const base64 = canvas.toDataURL('image/png').split(',')[1];
      llamarAPI('subirFirma', { base64: base64, idCapacitacion: idCapacitacion, documento: documento })
        .then(function (respuesta) {
          continuarRegistro(respuesta.success ? respuesta.data.url : '');
        });
    } else {

  // ---------- Subir evidencia fotográfica ----------
  document.getElementById('formFoto').addEventListener('submit', function (e) {
    e.preventDefault();

    const archivo = document.getElementById('fotoInput').files[0];
    const mensaje = document.getElementById('mensajeFoto');
    const btn = document.getElementById('btnSubirFoto');

    if (!idCapacitacion) {
      mensaje.className = 'mensaje error';
      mensaje.textContent = 'No hay una capacitación seleccionada.';
      return;
    }
    if (!archivo) return;

    btn.disabled = true;
    btn.textContent = 'Subiendo...';

    const lector = new FileReader();
    lector.onload = function () {
      const base64 = lector.result.split(',')[1];
      llamarAPI('registrarFoto', {
        'ID Capacitación': idCapacitacion,
        base64: base64,
        mimeType: archivo.type,
        nombreArchivo: archivo.name,
        'Descripción': document.getElementById('fotoDescripcion').value.trim(),
        'Usuario': usuarioActual['Nombre Completo'] || ''
      }).then(function (respuesta) {
        btn.disabled = false;
        btn.textContent = 'Subir evidencia';

        if (respuesta.success) {
          mensaje.className = 'mensaje exito';
          mensaje.textContent = 'Foto subida correctamente.';
          document.getElementById('formFoto').reset();
          cargarFotos();
        } else {
          mensaje.className = 'mensaje error';
          mensaje.textContent = respuesta.message || 'No se pudo subir la foto.';
        }
      }).catch(function (error) {
        btn.disabled = false;
        btn.textContent = 'Subir evidencia';
        mensaje.className = 'mensaje error';
        mensaje.textContent = 'Error de conexión: ' + error.message;
      });
    };
    lector.readAsDataURL(archivo);
  });

  // ---------- Galería de fotos ----------
  function cargarFotos() {
    if (!idCapacitacion) return;
    llamarAPI('listarFotos', { idCapacitacion: idCapacitacion }).then(function (respuesta) {
      const cont = document.getElementById('galeriaFotos');
      if (!respuesta.success || !(respuesta.data || []).length) {
        cont.innerHTML = '<div class="vacio">Aún no hay fotos subidas.</div>';
        return;
      }
      cont.innerHTML = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">' +

        }).join('') +
      '</div>';
    });
  }
