<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul-marca: #1F61A8;
      --azul-profundo: #00366C;
      --fondo: #F3F6FB;
      --superficie: #FFFFFF;
      --texto: #14213D;
      --texto-suave: #5B6B85;
      --verde-seguridad: #2E9E6D;
      --borde: #DCE4F0;
      --rojo-error: #C4432E;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 15% 20%, rgba(31,97,168,0.10), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(0,54,108,0.10), transparent 45%),
        var(--fondo);
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--texto);
      padding: 24px;
    }

    .marco {
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 44px 36px 36px;
      background: var(--superficie);
      border-radius: 4px;
      box-shadow: 0 24px 60px -20px rgba(0,54,108,0.25);
    }

    /* Esquinas tipo "marco de escáner", eco del corchete del logo */
    .marco::before,
    .marco::after,
    .marco .esquina-tr,
    .marco .esquina-br {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border: 3px solid var(--azul-marca);
    }
    .marco::before { top: -3px; left: -3px; border-right: none; border-bottom: none; }
    .marco::after { bottom: -3px; left: -3px; border-right: none; border-top: none; }
    .marco .esquina-tr { top: -3px; right: -3px; border-left: none; border-bottom: none; }
    .marco .esquina-br { bottom: -3px; right: -3px; border-left: none; border-top: none; }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .logo-wrap img {
      height: 46px;
      width: auto;
    }

    .eyebrow {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--texto-suave);
      margin: 18px 0 4px;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 28px;
      letter-spacing: -0.01em;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--texto-suave);
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--borde);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      letter-spacing: 0.02em;
      color: var(--texto);
      background: var(--fondo);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--azul-marca);
      box-shadow: 0 0 0 3px rgba(31,97,168,0.15);
      background: var(--superficie);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 4px;
      background: var(--azul-marca);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover { background: var(--azul-profundo); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: wait; }

    .mensaje {
      margin-top: 16px;
      padding: 11px 13px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      display: none;
    }
    .mensaje.error {
      display: block;
      background: rgba(196,67,46,0.08);
      color: var(--rojo-error);
      border: 1px solid rgba(196,67,46,0.25);
    }

    .pie {
      margin-top: 28px;
      text-align: center;
      font-size: 11px;
      color: var(--texto-suave);
      letter-spacing: 0.03em;
    }
  </style>
</head>

    <p class="eyebrow">Sistema de Capacitaciones</p>
    <h1>Ingresa con tu documento</h1>

    <form id="formLogin">
      <label for="documento">Número de documento</label>
      <input type="text" id="documento" name="documento" inputmode="numeric" autocomplete="off" placeholder="Ej: 1020304050" required autofocus>

      <div id="mensaje" class="mensaje"></div>

      <button type="submit" id="btnIngresar">Ingresar</button>
    </form>

    <p class="pie">Sucden Servicios &middot; Uso interno</p>
  </div>

  <script>
    const urlBase = "<?= urlBase ?>";

    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();

      const documento = document.getElementById('documento').value.trim();
      const boton = document.getElementById('btnIngresar');
      const mensaje = document.getElementById('mensaje');

      mensaje.className = 'mensaje';
      mensaje.textContent = '';

      if (!documento) return;

      boton.disabled = true;
      boton.textContent = 'Verificando...';

      google.script.run
        .withSuccessHandler(function(respuesta) {
          if (respuesta.ok) {
            sessionStorage.setItem('usuario', JSON.stringify(respuesta.datos));
            window.top.location.href = urlBase + '?page=dashboard';
          } else {
            mensaje.className = 'mensaje error';
            mensaje.textContent = respuesta.error;
            boton.disabled = false;
            boton.textContent = 'Ingresar';
          }
        })
        .withFailureHandler(function(error) {
          mensaje.className = 'mensaje error';
          mensaje.textContent = 'Error inesperado: ' + error.message;
          boton.disabled = false;
          boton.textContent = 'Ingresar';
        })
        .apiIniciarSesion(documento);
    });
  </script>
