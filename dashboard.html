<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Capacitaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul-marca: #1F61A8;
      --azul-profundo: #00366C;
      --fondo: #F3F6FB;
      --superficie: #FFFFFF;
      --texto: #14213D;
      --texto-suave: #5B6B85;
      --verde-seguridad: #2E9E6D;
      --ambar: #D9822B;
      --borde: #DCE4F0;
      --rojo-error: #C4432E;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fondo); font-family: 'Inter', -apple-system, sans-serif; color: var(--texto); }
    header {
      background: var(--azul-profundo); padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header img { height: 30px; }
    .usuario-chip { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #E8F0FB; }
    .usuario-chip strong { color: #fff; font-weight: 600; }
    #btnSalir {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; padding: 7px 14px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    #btnSalir:hover { background: rgba(255,255,255,0.22); }
    main { max-width: 1100px; margin: 0 auto; padding: 36px 24px 60px; }
    .top-fila {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
    }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--texto-suave); margin: 0 0 6px;
    }
    h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
    #btnNueva {
      background: var(--azul-marca); color: #fff; border: none; padding: 12px 20px;
      border-radius: 4px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    #btnNueva:hover { background: var(--azul-profundo); }
    .tabla-wrap {
      position: relative; background: var(--superficie); border-radius: 4px;
      box-shadow: 0 16px 40px -24px rgba(0,54,108,0.3); overflow: hidden;
    }
    .tabla-wrap::before, .tabla-wrap::after {
      content: ""; position: absolute; width: 20px; height: 20px; border: 3px solid var(--azul-marca); z-index: 2;
    }
    .tabla-wrap::before { top: -3px; left: -3px; border-right: none; border-bottom: none; }
    .tabla-wrap::after  { bottom: -3px; right: -3px; border-left: none; border-top: none; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--texto-suave); padding: 14px 16px; border-bottom: 1.5px solid var(--borde); background: #FAFCFF;
    }
    tbody td { padding: 14px 16px; font-size: 13.5px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #F8FAFE; }
    .codigo { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--azul-profundo); }
    .estado { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
    .estado.Programada { background: rgba(217,130,43,0.12); color: var(--ambar); }
    .estado.Finalizada { background: rgba(46,158,109,0.12); color: var(--verde-seguridad); }
    .estado.EnCurso, .estado.En-curso { background: rgba(31,97,168,0.12); color: var(--azul-marca); }
    .vacio, .cargando { padding: 60px 20px; text-align: center; color: var(--texto-suave); font-size: 14px; }
    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(20,33,61,0.45);
      align-items: center; justify-content: center; padding: 20px; z-index: 10;
    }
    .overlay.activo { display: flex; }
    .modal { background: #fff; width: 100%; max-width: 440px; border-radius: 4px; padding: 28px; position: relative; }
    .modal h2 { margin: 0 0 20px; font-size: 18px; font-weight: 800; }
    .campo { margin-bottom: 14px; }
    .campo label { display: block; font-size: 12px; font-weight: 600; color: var(--texto-suave); margin-bottom: 6px; }
    .campo input {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--borde);
      border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 14px;
    }
    .campo input:focus { outline: none; border-color: var(--azul-marca); }
    .modal-botones { display: flex; gap: 10px; margin-top: 20px; }
    .modal-botones button { flex: 1; padding: 11px; border-radius: 4px; font-size: 13.5px; font-weight: 700; cursor: pointer; border: none; }
    #btnCancelar { background: var(--fondo); color: var(--texto); }
    #btnGuardar { background: var(--azul-marca); color: #fff; }
    #btnGuardar:hover { background: var(--azul-profundo); }
    #btnGuardar:disabled { opacity: 0.6; cursor: wait; }
    .modal-mensaje {
      display: none; margin-top: 12px; padding: 10px 12px; border-radius: 4px; font-size: 12.5px;
      background: rgba(196,67,46,0.08); color: var(--rojo-error); border: 1px solid rgba(196,67,46,0.25);
    }
  </style>
</head>
<body>

      <span>Hola, <strong id="nombreUsuario">—</strong></span>

  </header>

  <main>
    <div class="top-fila">
      <div>
        <p class="eyebrow">Sistema de Capacitaciones</p>
        <h1>Capacitaciones</h1>
      </div>
      <button id="btnNueva">+ Nueva capacitación</button>
    </div>

    <div class="tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>Código</th><th>Tema</th><th>Fecha</th><th>Instructor</th><th>Lugar</th><th>Estado</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla">
          <tr><td colspan="6" class="cargando">Cargando capacitaciones...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>Nueva capacitación</h2>
      <form id="formNueva">
        <div class="campo">
          <label for="fCodigo">Código</label>
          <input type="text" id="fCodigo" placeholder="CAP-000010" required>
        </div>
        <div class="campo">
          <label for="fTema">Tema</label>
          <input type="text" id="fTema" placeholder="Seguridad Industrial" required>
        </div>
        <div class="campo">
          <label for="fFecha">Fecha</label>
          <input type="date" id="fFecha" required>
        </div>
        <div class="campo">
          <label for="fInstructor">Instructor</label>
          <input type="text" id="fInstructor" placeholder="Nombre del instructor">
        </div>
        <div class="campo">
          <label for="fLugar">Lugar</label>
          <input type="text" id="fLugar" placeholder="Sala de Juntas">
        </div>
        <div class="modal-mensaje" id="modalMensaje"></div>
        <div class="modal-botones">
          <button type="button" id="btnCancelar">Cancelar</button>
          <button type="submit" id="btnGuardar">Crear</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ============================================================
    // PEGA AQUÍ LA MISMA URL QUE PUSISTE EN index.html (termina en /exec)
    // ============================================================
    const API_URL = "https://script.google.com/macros/s/AKfycby5AviUlXW6hDNvvGWXRdE70C22TZZfGZf-hVKDCJednS513G4F8QN-aKeXUZJBjNNI/exec";

    // --- Sesión ---
    const usuarioRaw = sessionStorage.getItem('usuario');
    if (!usuarioRaw) {
      window.location.href = 'index.html';
    } else {
      const usuario = JSON.parse(usuarioRaw);
      document.getElementById('nombreUsuario').textContent = usuario['Nombre Completo'] || 'Usuario';
    }

    document.getElementById('btnSalir').addEventListener('click', function() {
      sessionStorage.removeItem('usuario');
      window.location.href = 'index.html';
    });

    // --- Cargar capacitaciones ---
    function cargarCapacitaciones() {
      fetch(API_URL + '?action=listarCapacitaciones')
        .then(function(r) { return r.json(); })
        .then(function(respuesta) {
          const cuerpo = document.getElementById('cuerpoTabla');

          if (!respuesta.ok) {
            cuerpo.innerHTML = '<tr><td colspan="6" class="vacio">Error: ' + respuesta.error + '</td></tr>';
            return;
          }

          const filas = respuesta.datos;

          if (!filas.length) {
            cuerpo.innerHTML = '<tr><td colspan="6" class="vacio">Aún no hay capacitaciones. Crea la primera con el botón de arriba.</td></tr>';
            return;
          }

          cuerpo.innerHTML = filas.map(function(c) {
            const estadoClase = (c['Estado'] || 'Programada').replace(/\s+/g, '-');
            return '<tr>'
              + '<td class="codigo">' + (c['Código'] || '') + '</td>'
              + '<td>' + (c['Tema'] || '') + '</td>'
              + '<td>' + (c['Fecha'] || '') + '</td>'
              + '<td>' + (c['Instructor'] || '—') + '</td>'
              + '<td>' + (c['Lugar'] || '—') + '</td>'
              + '<td><span class="estado ' + estadoClase + '">' + (c['Estado'] || 'Programada') + '</span></td>'
              + '</tr>';
          }).join('');
        })
        .catch(function(error) {
          document.getElementById('cuerpoTabla').innerHTML =
            '<tr><td colspan="6" class="vacio">Error de conexión: ' + error.message + '</td></tr>';
        });
    }

    cargarCapacitaciones();

    // --- Modal nueva capacitación ---
    const overlay = document.getElementById('overlay');
    document.getElementById('btnNueva').addEventListener('click', function() {
      overlay.classList.add('activo');
    });
    document.getElementById('btnCancelar').addEventListener('click', function() {
      overlay.classList.remove('activo');
    });
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) overlay.classList.remove('activo');
    });

    document.getElementById('formNueva').addEventListener('submit', function(e) {
      e.preventDefault();

      const boton = document.getElementById('btnGuardar');
      const mensaje = document.getElementById('modalMensaje');
      mensaje.style.display = 'none';

      const params = new URLSearchParams({
        action: 'crearCapacitacion',
        codigo: document.getElementById('fCodigo').value.trim(),
        tema: document.getElementById('fTema').value.trim(),
        fecha: document.getElementById('fFecha').value,
        instructor: document.getElementById('fInstructor').value.trim(),
        lugar: document.getElementById('fLugar').value.trim()
      });

      boton.disabled = true;
      boton.textContent = 'Creando...';

      fetch(API_URL + '?' + params.toString())
        .then(function(r) { return r.json(); })
        .then(function(respuesta) {
          boton.disabled = false;
          boton.textContent = 'Crear';

          if (respuesta.ok) {
            overlay.classList.remove('activo');
            document.getElementById('formNueva').reset();
            cargarCapacitaciones();
          } else {
            mensaje.textContent = respuesta.error;
            mensaje.style.display = 'block';
          }
        })
        .catch(function(error) {
          boton.disabled = false;
          boton.textContent = 'Crear';
          mensaje.textContent = 'Error de conexión: ' + error.message;
          mensaje.style.display = 'block';
        });
    });
  </script>

</body>
</html>
