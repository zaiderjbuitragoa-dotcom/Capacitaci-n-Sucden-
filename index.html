<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul-marca: #1F61A8;
      --azul-glow: #4FA6FF;
      --cian: #00E5FF;
      --fondo-0: #030711;
      --fondo-1: #071022;
      --panel: rgba(12, 22, 41, 0.72);
      --panel-borde: rgba(79, 166, 255, 0.22);
      --texto: #EAF2FF;
      --texto-suave: #7E93B8;
      --verde: #34D399;
      --rojo: #FF5D7A;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--texto);
      background: var(--fondo-0);
      overflow: hidden;
      position: relative;
    }

    .malla {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79,166,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,166,255,0.07) 1px, transparent 1px);
      background-size: 42px 42px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 80%);
              mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 80%);
      pointer-events: none;
    }

    .halo {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      opacity: 0.55;
    }
    .halo-1 { width: 480px; height: 480px; top: -160px; left: -140px; background: radial-gradient(circle, rgba(31,97,168,0.55), transparent 70%); }
    .halo-2 { width: 520px; height: 520px; bottom: -200px; right: -160px; background: radial-gradient(circle, rgba(0,229,255,0.18), transparent 70%); }

    .marco {
      position: relative;
      width: 100%;
      max-width: 408px;
      padding: 40px 34px 30px;
      background: var(--panel);
      border: 1px solid var(--panel-borde);
      border-radius: 14px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 30px 70px -25px rgba(0,0,0,0.65),
        0 0 0 1px rgba(255,255,255,0.02) inset;
      overflow: hidden;
      animation: aparecer 0.6s ease both;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .marco::after {
      content: "";
      position: absolute;
      left: 0; right: 0; top: -20%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--cian), transparent);
      box-shadow: 0 0 18px 2px rgba(0,229,255,0.6);
      animation: escaneo 1.4s ease-out 0.15s both;
    }
    @keyframes escaneo {
      0%   { top: -4%; opacity: 0; }
      12%  { opacity: 1; }
      100% { top: 104%; opacity: 0; }
    }

    .esquina {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--azul-glow);
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }
    .esq-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .esq-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .esq-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .esq-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    .estado {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--texto-suave);
      margin-bottom: 22px;
    }
    .punto {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--verde);
      box-shadow: 0 0 8px 1px var(--verde);
      animation: latido 1.8s ease-in-out infinite;
    }
    @keyframes latido {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .logo-wrap { display: flex; justify-content: center; margin-bottom: 18px; }
    .logo-wrap img { height: 40px; width: auto; filter: drop-shadow(0 0 14px rgba(79,166,255,0.35)); }

    .eyebrow {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cian);
      margin: 0 0 6px;
    }

    h1 {
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 26px;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--panel-borde);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 24px;
      position: relative;
    }
    .tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--texto-suave);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.2s ease;
      position: relative;
      z-index: 1;
    }
    .tab.activo { color: #071022; }
    .tab-indicador {
      position: absolute;
      top: 3px; left: 3px;
      width: calc(50% - 3px);
      height: calc(100% - 6px);
      background: linear-gradient(135deg, var(--azul-glow), var(--cian));
      border-radius: 8px;
      transition: transform 0.28s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 4px 16px -4px rgba(79,166,255,0.6);
    }
    .tabs[data-modo="crear"] .tab-indicador { transform: translateX(100%); }

    .vista { display: none; }
    .vista.activa { display: block; animation: entrar 0.3s ease both; }
    @keyframes entrar {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .campo { margin-bottom: 16px; }
    .campo label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--texto-suave);
      margin-bottom: 7px;
    }
    .fila-dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    input[type="text"], select {
      width: 100%;
      padding: 12px 13px;
      border: 1.5px solid rgba(79,166,255,0.18);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.01em;
      color: var(--texto);
      background: rgba(255,255,255,0.03);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    select { font-family: 'Inter', sans-serif; cursor: pointer; }
    select option { background: #0B1D33; color: var(--texto); }

    input::placeholder { color: rgba(126,147,184,0.55); }

    input:focus, select:focus {
      outline: none;
      border-color: var(--azul-glow);
      box-shadow: 0 0 0 3px rgba(79,166,255,0.15);
      background: rgba(79,166,255,0.06);
    }

    button.principal {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--azul-marca), var(--azul-glow));
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 10px 28px -10px rgba(31,97,168,0.65);
      transition: filter 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }
    button.principal:hover { filter: brightness(1.1); box-shadow: 0 12px 34px -8px rgba(79,166,255,0.75); }
    button.principal:active { transform: scale(0.98); }
    button.principal:disabled { opacity: 0.55; cursor: wait; filter: none; }

    .mensaje {
      margin-top: 14px;
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      display: none;
      font-family: 'JetBrains Mono', monospace;
    }
    .mensaje.error {
      display: block;
      background: rgba(255,93,122,0.09);
      color: var(--rojo);
      border: 1px solid rgba(255,93,122,0.28);
    }
    .mensaje.exito {
      display: block;
      background: rgba(52,211,153,0.09);
      color: var(--verde);
      border: 1px solid rgba(52,211,153,0.28);
    }

    .pie {
      margin-top: 26px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--texto-suave);
      letter-spacing: 0.04em;
    }

    @media (max-width: 420px) {
      .fila-dos { grid-template-columns: 1fr; }
    }
  </style>
</head>

    <p class="eyebrow">Sistema de Capacitaciones</p>
    <h1 id="titulo">Acceso al sistema</h1>

    <div class="tabs" id="tabs" data-modo="ingresar">
      <div class="tab-indicador"></div>
      <button type="button" class="tab activo" data-tab="ingresar">Ingresar</button>
      <button type="button" class="tab" data-tab="crear">Crear cuenta</button>
    </div>

    <div class="vista activa" id="vistaIngresar">
      <form id="formLogin">
        <div class="campo">
          <label for="documento">Número de documento</label>
          <input type="text" id="documento" name="documento" inputmode="numeric" autocomplete="off" placeholder="Ej: 1020304050" required autofocus>
        </div>

        <button type="submit" class="principal" id="btnIngresar">Ingresar</button>
        <div id="mensajeLogin" class="mensaje"></div>
      </form>
    </div>

    <div class="vista" id="vistaCrear">
      <form id="formCrear">
        <div class="campo">
          <label for="cDocumento">Número de documento</label>
          <input type="text" id="cDocumento" inputmode="numeric" autocomplete="off" placeholder="Ej: 1020304050" required>
        </div>

        <div class="campo">
          <label for="cNombre">Nombre completo</label>
          <input type="text" id="cNombre" autocomplete="off" placeholder="Ej: Ana Rodríguez" required>
        </div>

        <div class="fila-dos">
          <div class="campo">
            <label for="cCargo">Cargo</label>
            <input type="text" id="cCargo" autocomplete="off" placeholder="Ej: Analista">
          </div>
          <div class="campo">
            <label for="cArea">Área</label>
            <input type="text" id="cArea" autocomplete="off" placeholder="Ej: RH">
          </div>
        </div>

        <div class="fila-dos">
          <div class="campo">
            <label for="cRegional">Regional</label>
            <input type="text" id="cRegional" autocomplete="off" placeholder="Ej: Quindío">
          </div>
          <div class="campo">
            <label for="cRol">Rol</label>
            <select id="cRol">
              <option value="Colaborador" selected>Colaborador</option>
              <option value="Instructor">Instructor</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <label for="cCorreo">Correo</label>
          <input type="text" id="cCorreo" autocomplete="off" placeholder="nombre@sucden.com">
        </div>

        <div class="campo">
          <label for="cWhatsApp">WhatsApp</label>
          <input type="text" id="cWhatsApp" inputmode="numeric" autocomplete="off" placeholder="Ej: 3001234567">
        </div>

        <button type="submit" class="principal" id="btnCrear">Crear cuenta</button>
        <div id="mensajeCrear" class="mensaje"></div>
      </form>
    </div>

    <p class="pie">Sucden Servicios &middot; Uso interno</p>
  </div>

  <script>
    // ============================================================
    // PEGA AQUÍ LA URL DE TU DESPLIEGUE DE APPS SCRIPT (termina en /exec)
    // ============================================================
    const API_URL = "https://script.google.com/macros/s/AKfycby5AviUlXW6hDNvvGWXRdE70C22TZZfGZf-hVKDCJednS513G4F8QN-aKeXUZJBjNNI/exec";

    // ---------- Cambio de pestaña ----------
    const tabs = document.getElementById('tabs');
    const botonesTab = tabs.querySelectorAll('.tab');
    const titulo = document.getElementById('titulo');
    const vistaIngresar = document.getElementById('vistaIngresar');
    const vistaCrear = document.getElementById('vistaCrear');

    botonesTab.forEach(function (boton) {
      boton.addEventListener('click', function () {
        const modo = boton.dataset.tab;
        tabs.dataset.modo = modo;
        botonesTab.forEach(function (b) { b.classList.toggle('activo', b === boton); });

        if (modo === 'crear') {
          vistaIngresar.classList.remove('activa');
          vistaCrear.classList.add('activa');
          titulo.textContent = 'Crear tu cuenta';
        } else {
          vistaCrear.classList.remove('activa');
          vistaIngresar.classList.add('activa');
          titulo.textContent = 'Acceso al sistema';
        }
      });
    });

    // ---------- Ingresar ----------
    document.getElementById('formLogin').addEventListener('submit', function (e) {
      e.preventDefault();

      const documento = document.getElementById('documento').value.trim();
      const boton = document.getElementById('btnIngresar');
      const mensaje = document.getElementById('mensajeLogin');

      mensaje.className = 'mensaje';
      mensaje.textContent = '';
      if (!documento) return;

      boton.disabled = true;
      boton.textContent = 'Verificando...';

      const url = API_URL + '?action=login&documento=' + encodeURIComponent(documento);

      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (respuesta) {
          if (respuesta.ok) {
            sessionStorage.setItem('usuario', JSON.stringify(respuesta.datos));
            window.location.href = 'dashboard.html';
          } else {
            mensaje.className = 'mensaje error';
            mensaje.textContent = respuesta.error;
            boton.disabled = false;
            boton.textContent = 'Ingresar';
          }
        })
        .catch(function (error) {
          mensaje.className = 'mensaje error';
          mensaje.textContent = 'Error de conexión: ' + error.message;
          boton.disabled = false;
          boton.textContent = 'Ingresar';
        });
    });

    // ---------- Crear cuenta ----------
    document.getElementById('formCrear').addEventListener('submit', function (e) {
      e.preventDefault();

      const boton = document.getElementById('btnCrear');
      const mensaje = document.getElementById('mensajeCrear');

      const datos = {
        documento: document.getElementById('cDocumento').value.trim(),
        nombre: document.getElementById('cNombre').value.trim(),
        cargo: document.getElementById('cCargo').value.trim(),
        area: document.getElementById('cArea').value.trim(),
        regional: document.getElementById('cRegional').value.trim(),
        rol: document.getElementById('cRol').value,
        correo: document.getElementById('cCorreo').value.trim(),
        whatsapp: document.getElementById('cWhatsApp').value.trim()
      };

      mensaje.className = 'mensaje';
      mensaje.textContent = '';

      if (!datos.documento || !datos.nombre) {
        mensaje.className = 'mensaje error';
        mensaje.textContent = 'Documento y nombre completo son obligatorios.';
        return;
      }

      boton.disabled = true;
      boton.textContent = 'Creando...';

      const params = new URLSearchParams(Object.assign({ action: 'crearUsuario' }, datos));

      fetch(API_URL + '?' + params.toString())
        .then(function (r) { return r.json(); })
        .then(function (respuesta) {
          boton.disabled = false;
          boton.textContent = 'Crear cuenta';

          if (respuesta.ok) {
            mensaje.className = 'mensaje exito';
            mensaje.textContent = 'Cuenta creada. Ya puedes ingresar con tu documento.';
            document.getElementById('formCrear').reset();

            setTimeout(function () {
              tabs.dataset.modo = 'ingresar';
              botonesTab.forEach(function (b) { b.classList.toggle('activo', b.dataset.tab === 'ingresar'); });
              vistaCrear.classList.remove('activa');
              vistaIngresar.classList.add('activa');
              titulo.textContent = 'Acceso al sistema';
              document.getElementById('documento').value = datos.documento;
            }, 900);
          } else {
            mensaje.className = 'mensaje error';
            mensaje.textContent = respuesta.error;
          }
        })
        .catch(function (error) {
          mensaje.className = 'mensaje error';
          mensaje.textContent = 'Error de conexión: ' + error.message;
          boton.disabled = false;
          boton.textContent = 'Crear cuenta';
        });
    });
  </script>
